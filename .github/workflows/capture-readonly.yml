name: Read-only presentation capture
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: silenttip-readonly-capture
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'sharonbasovich/silenttip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare evidence directory
        run: mkdir -p "$GITHUB_WORKSPACE/capture-artifacts"
      - name: Install pinned official Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/silenttip-capture" --no-save --package-lock=false playwright@1.55.1
          "$RUNNER_TEMP/silenttip-capture/node_modules/.bin/playwright" install --with-deps chromium
          cp scripts/capture-readonly.mjs "$RUNNER_TEMP/silenttip-capture/capture-readonly.mjs"
      - name: Capture only the public binding flow
        env:
          SOURCE_ROOT: ${{ github.workspace }}
          CAPTURE_DIR: ${{ github.workspace }}/capture-artifacts
        run: node "$RUNNER_TEMP/silenttip-capture/capture-readonly.mjs"
      - name: Record workflow outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/capture-artifacts"
          node -e 'require("fs").writeFileSync("capture-artifacts/workflow-status.json",JSON.stringify({status:process.env.JOB_STATUS,sha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT},null,2))'
      - name: Preserve captured evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silenttip-readonly-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: capture-artifacts/
          if-no-files-found: error
          retention-days: 7
